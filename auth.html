<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Truniqe</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛</text></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>

<body>
  <div class="auth-page">

    <!-- Left side visual -->
    <div class="auth-visual">
      <img
        src="https://images.unsplash.com/photo-1542314831-c6a4d27ce006?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Heritage Property">
      <div class="auth-visual-content">
        <div class="auth-visual-quote">"A hotel should relieve you from the friction of everyday life, not add to it."
        </div>
        <div class="auth-visual-attr">The Truniqe Philosophy</div>
      </div>
    </div>

    <!-- Right side form -->
    <div class="auth-form-side">
      <div style="max-width: 400px; width: 100%; margin: 0 auto;">
        
        <a href="/" class="auth-logo" style="text-decoration:none; display:inline-block;">Trun<span>iqe</span></a>

        <div class="auth-title" id="auth-title">Welcome back</div>
        <div class="auth-subtitle" id="auth-subtitle">Sign in to manage your bookings and saved stays.</div>

        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-signin">Sign In</div>
          <div class="auth-tab" id="tab-signup">Create Account</div>
        </div>

        <form id="auth-form" class="auth-form">
          
          <!-- Name field (only for signup) -->
          <div class="form-group" id="group-name" style="display: none;">
            <label class="form-label" for="auth-name">Full Name</label>
            <input type="text" id="auth-name" class="form-input" placeholder="Jane Doe">
          </div>

          <div class="form-group">
            <label class="form-label" for="auth-email">Email Address</label>
            <input type="email" id="auth-email" class="form-input" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label class="form-label" for="auth-password">Password</label>
              <a href="#" id="forgot-password" style="font-size:var(--text-xs); color:var(--text-muted); text-decoration:none;">Forgot password?</a>
            </div>
            <input type="password" id="auth-password" class="form-input" placeholder="••••••••" required minlength="6">
          </div>

          <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="width: 100%; justify-content:center;">Sign In</button>
        </form>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <button type="button" class="btn-google" id="btn-google">
          <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <script type="module" src="js/auth-page.js"></script>
</body>

</html>
